name: Update experience years

on:
  schedule:
    - cron: "0 6 1 * *" # día 1 de cada mes; el cambio de año se aplica el 1 de enero
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update experience years
        run: node .github/scripts/update-experience.mjs

      - name: Commit if something changed
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh experience years"
          git push
